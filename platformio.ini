; Claude Token Monitor - PlatformIO Configuration
; Board: ESP32 DevKit (30-pin, TYPE-C)
; Display: OLED SSD1306 0.91" (128x32) I2C

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=3
